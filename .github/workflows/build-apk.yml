name: Build APK  
  
on:  
   
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v4  
  
      - uses: actions/setup-java@v4  
        with:  
          distribution: 'temurin'  
          java-version: '17'  
  
      - uses: gradle/actions/setup-gradle@v4
        with:
            gradle-version: '8.0'
            validate-wrappers: false

      - name: Install CMake 3.18.1
        run: |
              SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
              yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
              "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "cmake;3.18.1"

  
      - name: Build release APK  
        working-directory: duix-android/dh_aigc_android  
        run: gradle :test:assembleRelease --stacktrace  
  
      - name: Upload APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: duix-apk  
          path: duix-android/dh_aigc_android/test/build/outputs/apk/release/*.apk
